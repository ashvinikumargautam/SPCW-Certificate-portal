    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    /* Header Inspired by Poster */
    .header {
      background: linear-gradient(to right, #004a96, #0094d4);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: bold;
    }

    .header h3 {
      margin: 10px 0 0;
      font-size: 20px;
    }

    .container {
      max-width: 600px;
      background: white;
      margin: 40px auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0066b3;
      color: white;
      border: none;
      margin-top: 20px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #004f8a;
    }

    #certificateBox {
      margin-top: 25px;
      padding: 20px;
      background: #e8f4ff;
      border-left: 5px solid #007acc;
      display: none;
      border-radius: 5px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

    function showCertificate() {
      const name = dropdown.value;
      const phone = document.getElementById("phoneInput").value.trim();
      const box = document.getElementById("certificateBox");

      const person = people.find(p => p.name === name && p.phone === phone);

      if (person) {
        box.style.display = "block";
        box.innerHTML = `
          <h3>Certificate for ${person.name}</h3>
          <a href="${person.cert}" target="_blank" style="font-size:18px; color:#0057b3;">Open Certificate</a>
        `;
      } else {
        box.style.display = "block";
        box.innerHTML = `<p style='color:red;'>Name or Mobile number is incorrect.</p>`;
